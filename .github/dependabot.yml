# The modules and the actions both pin versions this repository does not
# control: go.mod holds a pseudo-version for a dependency with no tags, and
# every action is pinned by SHA. Neither moves without something asking.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
