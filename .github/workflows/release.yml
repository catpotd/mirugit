name: release

on:
  push:
    tags: ["v*"]

jobs:
  # A tag push does not run ci.yml, which reacts to main and to pull requests.
  # Without this job a tag on a red commit published binaries anyway.
  check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Identify the test committer
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
      - run: make check
      - run: make test-race
      - run: make fuzz FUZZTIME=30s
      - run: make supply-chain

  release:
    needs: check
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      # Building every target from one Linux runner keeps the four binaries on
      # one commit and one toolchain. This program calls no C, so nothing here
      # needs a matching host.
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          version="${GITHUB_REF_NAME}"
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="mirugit-${version}-${os}-${arch}"
            GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-X main.version=${version}" \
              -o "dist/${name}/mirugit" ./cmd/mirugit
            ./tools/notices.sh "dist/${name}/mirugit" "dist/${name}/THIRD_PARTY_NOTICES.txt"
            cp LICENSE README.md "dist/${name}/"
            tar -czf "dist/${name}.tar.gz" -C dist "${name}"
            rm -rf "dist/${name}"
          done
          cd dist && sha256sum -- *.tar.gz > checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          --title "${GITHUB_REF_NAME}"
          --draft
          --generate-notes
          dist/*.tar.gz dist/checksums.txt
